# CI memory safety (CircleCI container was OOM-killing the daemon:
# "Gradle build daemon disappeared unexpectedly").
# Gradle daemon heap 1.5G + metaspace 384M, Kotlin daemon 768M, 2 workers.
org.gradle.jvmargs=-Xmx1536M -XX:MaxMetaspaceSize=384M -Dfile.encoding=UTF-8
android.useAndroidX=true
android.newDsl=false
android.builtInKotlin=false
kotlin.daemon.jvmargs=-Xmx768M
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.daemon=false
