name: FlavorFlow production server check

on:
  push:
    branches:
      - arena/b7695262-flavorflow
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-production:
    name: Check app.flavorflow.co.in
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public app web root
        shell: bash
        run: |
          set -euo pipefail
          page="$RUNNER_TEMP/flavorflow-app.html"
          status=$(curl --silent --show-error --location --max-time 25 \
            --output "$page" --write-out '%{http_code}' \
            https://app.flavorflow.co.in/)
          echo "app.flavorflow.co.in/ -> HTTP $status"
          [[ "$status" == 200 ]] || { head -c 500 "$page" || true; exit 1; }
          grep -qiE '<!doctype html|<html' "$page" || {
            echo 'The app root did not return an HTML document.' >&2
            exit 1
          }
          if grep -qiE 'flutter_bootstrap\.js|main\.dart\.js' "$page"; then
            echo 'Flutter web app shell detected.'
          else
            echo 'HTTP 200, but the response does not look like a Flutter web app shell.'
          fi

      - name: Check SaaS gateway health endpoint
        shell: bash
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/flavorflow-health.json"
          status=$(curl --silent --show-error --location --max-time 25 \
            --output "$body" --write-out '%{http_code}' \
            https://app.flavorflow.co.in/api/saas/health)
          echo "app.flavorflow.co.in/api/saas/health -> HTTP $status"
          [[ "$status" == 200 ]] || { head -c 500 "$body" || true; exit 1; }
          python3 - "$body" <<'PY'
          import json
          import pathlib
          import sys

          data = json.loads(pathlib.Path(sys.argv[1]).read_text())
          if data.get('ok') is not True or data.get('service') != 'flavorflow-saas':
              raise SystemExit(f'Unexpected health response: {data!r}')
          print('SaaS gateway is healthy.')
          PY
