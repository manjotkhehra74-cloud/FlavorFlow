name: FlavorFlow production server check

on:
  push:
    branches:
      - arena/b7695262-flavorflow
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-production:
    name: Check app.flavorflow.co.in
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public app web root
        shell: bash
        run: |
          set -euo pipefail
          page="$RUNNER_TEMP/flavorflow-app.html"
          if ! status=$(curl --silent --show-error --location --max-time 25 \
            --output "$page" --write-out '%{http_code}' \
            https://app.flavorflow.co.in/); then
            echo '::error title=App web root::Request to https://app.flavorflow.co.in/ did not complete.'
            exit 1
          fi
          echo "app.flavorflow.co.in/ -> HTTP $status"
          if [[ "$status" != 200 ]]; then
            snippet=$(head -c 300 "$page" | tr '\r\n' '  ' | sed 's/%/%25/g')
            echo "::error title=App web root HTTP $status::$snippet"
            exit 1
          fi
          if ! grep -qiE '<!doctype html|<html' "$page"; then
            echo '::error title=App web root::HTTP 200, but response is not HTML.'
            exit 1
          fi
          if grep -qiE 'flutter_bootstrap\.js|main\.dart\.js' "$page"; then
            echo '::notice title=App web root::HTTP 200; Flutter web app shell detected.'
          else
            echo '::warning title=App web root::HTTP 200, but no Flutter web app shell was detected.'
          fi

      - name: Check SaaS gateway health endpoint
        shell: bash
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/flavorflow-health.json"
          if ! status=$(curl --silent --show-error --location --max-time 25 \
            --output "$body" --write-out '%{http_code}' \
            https://app.flavorflow.co.in/api/saas/health); then
            echo '::error title=Gateway health::Request to /api/saas/health did not complete.'
            exit 1
          fi
          echo "app.flavorflow.co.in/api/saas/health -> HTTP $status"
          if [[ "$status" != 200 ]]; then
            snippet=$(head -c 300 "$body" | tr '\r\n' '  ' | sed 's/%/%25/g')
            echo "::error title=Gateway health HTTP $status::$snippet"
            exit 1
          fi
          if ! python3 - "$body" <<'PY'
          import json
          import pathlib
          import sys

          data = json.loads(pathlib.Path(sys.argv[1]).read_text())
          if data.get('ok') is not True or data.get('service') != 'flavorflow-saas':
              raise SystemExit(1)
          PY
          then
            snippet=$(head -c 300 "$body" | tr '\r\n' '  ' | sed 's/%/%25/g')
            echo "::error title=Gateway health response invalid::$snippet"
            exit 1
          fi
          echo '::notice title=Gateway health::HTTP 200; SaaS gateway is healthy.'
