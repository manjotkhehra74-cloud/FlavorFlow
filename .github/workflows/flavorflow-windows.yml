name: FlavorFlow Windows preview

on:
  push:
    branches: [arena/f2bca6ec-flavorflow]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.*'
      - 'tools/bootstrap-windows.ps1'
      - 'tools/windows/**'
      - '.github/workflows/flavorflow-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flavorflow-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Build shared ERP for Windows
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Generate Windows runner only
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          ./tools/bootstrap-windows.ps1
      - name: Install existing ERP dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          & flutter pub get 2>&1 | Tee-Object -FilePath windows-pub-get.log
          $PubExit = $LASTEXITCODE
          if ($PubExit -ne 0) {
            $Tail = (Get-Content windows-pub-get.log -Tail 18) -join "`n"
            $Escaped = $Tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows dependency diagnostics::$Escaped"
            exit $PubExit
          }
      - name: Test mobile and desktop capability boundaries
        run: flutter test test/platform_capabilities_test.dart
      - name: Build Windows release bundle
        # Native users enter their company code/server; never bake in localhost.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          flutter doctor -v
          & flutter build windows --release 2>&1 | Tee-Object -FilePath windows-build.log
          $BuildExit = $LASTEXITCODE
          if ($BuildExit -ne 0) {
            $Tail = (Get-Content windows-build.log -Tail 18) -join "`n"
            $Escaped = $Tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows build diagnostics::$Escaped"
            exit $BuildExit
          }
      - name: Zip the complete runnable bundle
        shell: pwsh
        run: |
          $Bundle = 'build/windows/x64/runner/Release'
          if (-not (Test-Path "$Bundle/flavorflow_erp.exe")) {
            throw 'Windows executable missing from build output.'
          }
          Compress-Archive -Path "$Bundle/*" -DestinationPath flavorflow-windows-preview.zip
      - name: Upload Windows QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: flavorflow-windows-preview
          path: flavorflow-windows-preview.zip
          if-no-files-found: error
          retention-days: 14
