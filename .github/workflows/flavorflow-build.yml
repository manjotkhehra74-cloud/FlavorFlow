name: FlavorFlow build

on:
  push:
    branches:
      - main
      - arena/01a0dc70-flavorflow
      - arena/02900f8a-flavorflow
      - arena/b7695262-flavorflow
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flavorflow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analyze, test and build web + Android APK/AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Generate launcher and web icons
        run: dart run flutter_launcher_icons || echo "::warning::Icon generator did not complete; checked-in PWA icons already contain the final logo."

      - name: Analyze Flutter app
        shell: bash
        run: |
          set +e
          flutter analyze --no-fatal-infos lib test > "$RUNNER_TEMP/flutter-analyze.log" 2>&1
          analyze_status=$?
          set -e
          cat "$RUNNER_TEMP/flutter-analyze.log"
          if [[ "$analyze_status" -ne 0 ]]; then
            python3 - "$RUNNER_TEMP/flutter-analyze.log" <<'PY'
          import pathlib
          import sys

          def escape_data(value):
              return value.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")

          def escape_property(value):
              return escape_data(value).replace(":", "%3A").replace(",", "%2C")

          text = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
          found = 0
          for raw_line in text.splitlines():
              parts = [part.strip() for part in raw_line.strip().split(" • ")]
              if len(parts) < 4 or parts[0] not in {"error", "warning"}:
                  continue
              severity, message = parts[0], parts[1]
              location, rule = parts[-2], parts[-1]
              try:
                  file_path, line, column = location.rsplit(":", 2)
              except ValueError:
                  file_path, line, column = location, "", ""
              level = "error" if severity == "error" else "warning"
              properties = [f"file={escape_property(file_path)}"]
              if line.isdigit():
                  properties.append(f"line={line}")
              if column.isdigit():
                  properties.append(f"col={column}")
              properties.append(f"title={escape_property(rule)}")
              print(f"::{level} {','.join(properties)}::{escape_data(message)}")
              found += 1

          if found == 0:
              text = text.strip() or "flutter analyze failed without producing output."
              text = escape_data(text[:12000])
              print(f"::error title=Flutter analyzer output::{text}")
          PY
          fi
          exit "$analyze_status"

      - name: Run Flutter tests
        run: flutter test

      - name: Configure Android upload signing (when credentials are available)
        id: signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_KEYSTORE_BASE64" ]]; then
            if [[ -n "$ANDROID_KEYSTORE_PASSWORD$ANDROID_KEY_ALIAS$ANDROID_KEY_PASSWORD" ]]; then
              echo "Upload-key secrets are incomplete; refusing to build a misleading release." >&2
              exit 1
            fi
            echo "No upload key configured: build outputs will be debug-signed test packages, not Play Store upload packages."
            echo "artifact_name=FlavorFlow-Android-test-debug-signed" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing ANDROID_KEYSTORE_PASSWORD}"
          : "${ANDROID_KEY_ALIAS:?Missing ANDROID_KEY_ALIAS}"
          : "${ANDROID_KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD}"
          KEYSTORE_FILE="$RUNNER_TEMP/flavorflow-upload-key"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$KEYSTORE_FILE"
          chmod 600 "$KEYSTORE_FILE"
          if keytool -list -keystore "$KEYSTORE_FILE" -storepass "$ANDROID_KEYSTORE_PASSWORD" -storetype JKS >/dev/null 2>&1; then
            STORE_TYPE=jks
          elif keytool -list -keystore "$KEYSTORE_FILE" -storepass "$ANDROID_KEYSTORE_PASSWORD" -storetype PKCS12 >/dev/null 2>&1; then
            STORE_TYPE=pkcs12
          else
            echo "Android upload keystore/password invalid or unsupported." >&2
            exit 1
          fi
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\nstoreType=%s\n' \
            "$KEYSTORE_FILE" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" "$STORE_TYPE" > android/key.properties
          echo "artifact_name=FlavorFlow-Android-signed-release" >> "$GITHUB_OUTPUT"

      - name: Build web
        run: flutter build web --release --no-tree-shake-icons --dart-define=API_BASE=https://app.flavorflow.co.in/api

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: flavorflow-web
          path: build/web
          if-no-files-found: error
          retention-days: 7

      - name: Build Android APK
        run: flutter build apk --release --dart-define=API_BASE=https://app.flavorflow.co.in/api

      - name: Build Play Store Android App Bundle
        run: flutter build appbundle --release --dart-define=API_BASE=https://app.flavorflow.co.in/api

      - name: Verify Android release packages
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          AAB=build/app/outputs/bundle/release/app-release.aab
          test -s "$APK"
          test -s "$AAB"
          unzip -tq "$APK"
          jarsigner -verify "$AAB" >/dev/null
          echo "APK and AAB are present and pass archive/signature checks."
          ls -lh "$APK" "$AAB"

      - name: Upload Android release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.signing.outputs.artifact_name }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

  deploy-web:
    name: Deploy Flutter web to production VPS
    needs: build
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/arena/b7695262-flavorflow') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY_HOST: ${{ secrets.FLAVORFLOW_DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.FLAVORFLOW_DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.FLAVORFLOW_DEPLOY_SSH_KEY }}
      DEPLOY_PORT: ${{ secrets.FLAVORFLOW_DEPLOY_PORT }}
      DEPLOY_PATH: ${{ vars.FLAVORFLOW_DEPLOY_PATH || '/opt/flavorflow/web' }}

    steps:
      - name: Check whether production deployment is configured
        id: deploy-config
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$DEPLOY_HOST" || -z "$DEPLOY_USER" || -z "$DEPLOY_SSH_KEY" ]]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::notice title=Web deployment skipped::Add FLAVORFLOW_DEPLOY_HOST, FLAVORFLOW_DEPLOY_USER, and FLAVORFLOW_DEPLOY_SSH_KEY in GitHub Actions secrets to enable automatic deployment.'
            exit 0
          fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Download the GitHub-built web artifact
        if: steps.deploy-config.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: flavorflow-web
          path: build/web

      - name: Validate artifact and configure SSH
        if: steps.deploy-config.outputs.ready == 'true'
        id: ssh-config
        shell: bash
        run: |
          set -euo pipefail
          test -s build/web/index.html || { echo "::error::GitHub web artifact is missing index.html."; exit 1; }
          if [[ "$DEPLOY_PATH" != /* || "$DEPLOY_PATH" == *".."* || "$DEPLOY_PATH" == *[[:space:]]* ]]; then
            echo '::error::FLAVORFLOW_DEPLOY_PATH must be an absolute path without whitespace or parent-directory segments.'
            exit 1
          fi
          port="${DEPLOY_PORT:-22}"
          key_file="$RUNNER_TEMP/flavorflow-deploy-key"
          known_hosts="$RUNNER_TEMP/flavorflow-known-hosts"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key_file"
          chmod 600 "$key_file"
          ssh-keyscan -p "$port" -H "$DEPLOY_HOST" > "$known_hosts" 2>/dev/null
          test -s "$known_hosts" || { echo "::error::Could not verify the server SSH host key."; exit 1; }
          echo "key_file=$key_file" >> "$GITHUB_OUTPUT"
          echo "known_hosts=$known_hosts" >> "$GITHUB_OUTPUT"
          echo "port=$port" >> "$GITHUB_OUTPUT"

      - name: Back up and deploy to the production web root
        if: steps.deploy-config.outputs.ready == 'true'
        shell: bash
        env:
          SSH_KEY_FILE: ${{ steps.ssh-config.outputs.key_file }}
          SSH_KNOWN_HOSTS: ${{ steps.ssh-config.outputs.known_hosts }}
          SSH_PORT: ${{ steps.ssh-config.outputs.port }}
        run: |
          set -euo pipefail
          remote_tmp="/tmp/flavorflow-web-${GITHUB_SHA}"
          ssh_opts=(-i "$SSH_KEY_FILE" -p "$SSH_PORT" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$SSH_KNOWN_HOSTS")
          tar -C build/web -czf - . | ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$remote_tmp' && tar -xzf - -C '$remote_tmp'"
          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "$remote_tmp" "$DEPLOY_PATH" "$GITHUB_SHA" <<'REMOTE'
          set -euo pipefail
          staging="$1"
          web="$2"
          sha="$3"
          backup_dir="$(dirname "$web")/backups"
          deploy_user="$(id -un)"
          [[ -s "$staging/index.html" ]] || { echo 'Staged index.html is missing.' >&2; exit 1; }
          if [[ "$(id -u)" -ne 0 ]]; then
            for deploy_dir in "$web" "$backup_dir"; do
              if [[ -d "$deploy_dir" ]]; then
                writable_path="$deploy_dir"
              else
                writable_path="$(dirname "$deploy_dir")"
              fi
              if [[ ! -d "$writable_path" || ! -w "$writable_path" ]]; then
                echo "::error::SSH user $deploy_user cannot write $deploy_dir. Give the SSH user ownership of the web and backups directories once; the workflow intentionally does not use sudo."
                exit 1
              fi
            done
          fi
          mkdir -p "$web" "$backup_dir"
          tar -czf "$backup_dir/web-before-$sha.tgz" -C "$web" .
          cp -a "$staging"/. "$web"/
          printf '%s %s\n' "$sha" "$(date -u +%FT%TZ)" > "$web/ff-web-version.txt"
          rm -rf "$staging"
          echo "Deployed GitHub web build $sha to $web; backup saved under $backup_dir."
          REMOTE

      - name: Verify the production bundle contains the dispatch fix
        if: steps.deploy-config.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/production-main.dart.js"
          status=$(curl --silent --show-error --location --retry 5 --retry-delay 3 --max-time 30 \
            --output "$bundle" --write-out '%{http_code}' \
            "https://app.flavorflow.co.in/main.dart.js?build=$GITHUB_SHA")
          [[ "$status" == 200 ]] || { echo "::error::Production main.dart.js returned HTTP $status."; exit 1; }
          if ! grep -Fq 'Could not load available batches.' "$bundle"; then
            echo '::error::Production bundle does not contain the dispatch batch-code fix.'
            exit 1
          fi
          echo 'Production web app is serving the dispatch batch-code fix.'

  build-windows:
    name: Build Windows desktop portable x64
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Create and configure native Windows runner
        shell: pwsh
        run: .\tools\configure-windows.ps1

      - name: Generate Windows application icon
        run: dart run flutter_launcher_icons -f windows_launcher_icons.yaml

      - name: Build Windows release
        shell: pwsh
        run: |
          $buildOutput = & flutter build windows --release --dart-define=API_BASE=https://app.flavorflow.co.in/api 2>&1
          $buildExitCode = $LASTEXITCODE
          $buildOutput | ForEach-Object { Write-Host $_ }
          if ($buildExitCode -ne 0) {
            $tail = ($buildOutput | Select-Object -Last 60 | ForEach-Object { "$_" }) -join "`n"
            $escaped = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Flutter Windows build::$escaped"
            exit $buildExitCode
          }

      - name: Package and verify portable x64 build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseDir = Join-Path $PWD 'build/windows/x64/runner/Release'
          $required = @(
            (Join-Path $releaseDir 'flavorflow_erp.exe'),
            (Join-Path $releaseDir 'flutter_windows.dll'),
            (Join-Path $releaseDir 'data/flutter_assets')
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Missing Windows release output: $path" }
          }
          $readme = @'
          FlavorFlow ERP for Windows (portable x64)

          Extract the complete ZIP and keep all files together, then run flavorflow_erp.exe.
          Requires Windows 10/11 x64 and the Microsoft Visual C++ 2015-2022 x64 runtime.
          First build is unsigned; Windows SmartScreen may show a warning.
          CSV/XLSX files go to Downloads. PDF actions use the Windows print flow.
          Use product/material code-entry fields or a USB keyboard-wedge barcode scanner.
          Camera scanning, photos, GPS stamps, phone notifications and reminders are mobile-only.
          '@
          $readme | Set-Content -Path (Join-Path $releaseDir 'README-Windows.txt') -Encoding utf8
          $zipPath = Join-Path $PWD 'build/FlavorFlow-Windows-x64-portable.zip'
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path (Join-Path $releaseDir '*') -DestinationPath $zipPath -CompressionLevel Optimal
          if ((Get-Item $zipPath).Length -lt 1000000) { throw 'Windows portable ZIP is unexpectedly small.' }

      - name: Upload Windows portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlavorFlow-Windows-x64-portable
          path: build/FlavorFlow-Windows-x64-portable.zip
          if-no-files-found: error
          retention-days: 14
