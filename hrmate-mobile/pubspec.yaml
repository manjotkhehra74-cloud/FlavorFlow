name: hrmate
description: HRMate — native Android app for the HRMate Workforce Portal (attendance, punch, leaves, team).
publish_to: "none"

# Native app series = 2.x (the WebView shell was 1.x). Bump +1 per phase.
version: 3.2.0+33

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5
  go_router: ^14.8.1
  http: ^1.3.0
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  intl: ^0.20.2
  url_launcher: ^6.3.2
  connectivity_plus: ^6.1.0
  package_info_plus: ^8.1.0
  # Phase 6 push (ARCHITECTURE.md §3 allow-list). Pinned: firebase_* 3.x/15.x are the
  # last lines that build on Flutter 3.29 / Dart 3.7 (Codemagic image); local
  # notifications 19.x is the last major before the Dart 3.8 requirement.
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^19.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
  fonts:
    # Inter v4 (OFL, assets/fonts/OFL.txt) — the webapp's typeface (Phase 7).
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Inter-Black.ttf
          weight: 900
