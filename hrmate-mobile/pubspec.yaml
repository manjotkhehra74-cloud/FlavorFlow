name: hrmate
description: HRMate — native Android app for the HRMate Workforce Portal (attendance, punch, leaves, team).
publish_to: "none"

# Native app series = 2.x (the WebView shell was 1.x). Bump +1 per phase.
version: 2.4.0+25

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5
  go_router: ^14.8.1
  http: ^1.3.0
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  intl: ^0.20.2
  url_launcher: ^6.3.2
  connectivity_plus: ^6.1.0
  package_info_plus: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
