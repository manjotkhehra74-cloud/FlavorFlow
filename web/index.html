<!DOCTYPE html>
<html>
<head>
  <!--
    The value below is replaced by the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="FlavorFlow ERP — universal manufacturing ERP — production, stores, packing &amp; dispatch with strict role-based access.">
  <meta name="theme-color" content="#0C2135">

  <!-- Installable app (PWA) — Android Chrome / desktop Chrome & Edge -->
  <meta name="mobile-web-app-capable" content="yes">

  <!-- iPhone & iPad: Add to Home Screen → fullscreen app with dark status bar -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FlavorFlow">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>FlavorFlow ERP</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* pre-app splash: dark navy with monogram, matches the app shell */
    html, body { margin: 0; padding: 0; background: #0C2135; height: 100%; }
    #ff-splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    }
    #ff-splash .mark {
      width: 64px; height: 64px; border-radius: 14px;
      background: linear-gradient(135deg, #0A6ED1, #0891B2);
      color: #fff; font-weight: 800; font-size: 26px; letter-spacing: 1px;
      display: flex; align-items: center; justify-content: center;
    }
    #ff-splash .name { color: #E8EEF4; font-size: 17px; font-weight: 600; }
    #ff-splash .bar {
      width: 120px; height: 3px; border-radius: 2px; overflow: hidden;
      background: rgba(255,255,255,0.14);
    }
    #ff-splash .bar i {
      display: block; height: 100%; width: 40%; border-radius: 2px;
      background: #3B9DF2; animation: ffslide 1.1s ease-in-out infinite;
    }
    @keyframes ffslide { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
    /* hide the splash once the Flutter view is attached */
    #ff-splash:has(~ flt-glass-pane), flt-glass-pane ~ #ff-splash { display: none; }
  </style>
</head>
<body>
  <div id="ff-splash">
    <div class="mark"><img src="icons/Icon-192.png" alt="FlavorFlow" style="width:100%;height:100%;border-radius:inherit;object-fit:cover"></div>
    <div class="name">FlavorFlow ERP</div>
    <div class="bar"><i></i></div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // remove the splash as soon as Flutter renders its first frame
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('ff-splash');
      if (s) s.parentNode.removeChild(s);
    });
    setTimeout(function () {
      var s = document.getElementById('ff-splash');
      if (s && document.querySelector('flt-glass-pane')) s.parentNode.removeChild(s);
    }, 6000);
  </script>
</body>
</html>
