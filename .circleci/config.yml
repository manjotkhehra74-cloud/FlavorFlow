version: 2.1

# FlavorFlow Android release builds on CircleCI.
# The approval gate means pushes do not consume build credits by themselves.
# In CircleCI, open the latest pipeline and approve "approve-release" only
# when an AAB/APK is actually needed.

executors:
  flutter_android:
    docker:
      - image: ghcr.io/cirruslabs/flutter:stable
    resource_class: medium
    environment:
      ERP_SERVER_API: "https://flavorflow.duckdns.org/api"
      # CircleCI Medium has limited RAM. Keep Gradle/Kotlin in one small JVM;
      # Flutter/Dart and Android tooling need the remaining memory.
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Dorg.gradle.parallel=false -Dkotlin.compiler.execution.strategy=in-process"

jobs:
  build-play-store-release:
    executor: flutter_android
    steps:
      - checkout

      - run:
          name: Verify Flutter and Java
          command: |
            flutter --version
            java -version

      - restore_cache:
          keys:
            - flavorflow-v2-{{ checksum "pubspec.lock" }}
            - flavorflow-v2-

      - run:
          name: Get Flutter packages
          command: flutter pub get

      - save_cache:
          key: flavorflow-v2-{{ checksum "pubspec.lock" }}
          paths:
            - ~/.pub-cache
            - ~/.gradle/caches
            - ~/.gradle/wrapper

      - run:
          name: Generate launcher icons (Android)
          command: |
            # This repository is Android/web only. The package generates the
            # Android icons first, then exits when it cannot find ios/Runner.
            # Keep the generated/committed Android icons and continue.
            dart run flutter_launcher_icons || echo "iOS icon target absent — Android icons retained"

      - run:
          name: Prepare complete Android toolchain and low-memory Gradle
          no_output_timeout: 25m
          command: |
            set -euo pipefail
            NDK_VERSION="28.2.13676358"
            CMAKE_VERSION="3.22.1"
            SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/opt/android-sdk-linux}}"
            SDKMANAGER=$(find "$SDK_ROOT" -type f -name sdkmanager -print -quit)
            test -n "$SDKMANAGER"
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

            # Install every package seen in the Gradle logs BEFORE a Gradle JVM
            # exists. This prevents sdkmanager + a 1.4GB daemon overlapping.
            "$SDKMANAGER" \
              "platforms;android-34" \
              "platforms;android-35" \
              "build-tools;34.0.0" \
              "build-tools;35.0.0" \
              "cmake;$CMAKE_VERSION" \
              "ndk;$NDK_VERSION"

            test -d "$SDK_ROOT/platforms/android-34"
            test -d "$SDK_ROOT/platforms/android-35"
            test -d "$SDK_ROOT/build-tools/35.0.0"
            test -d "$SDK_ROOT/cmake/$CMAKE_VERSION"
            test -d "$SDK_ROOT/ndk/$NDK_VERSION"

            sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx1400M -XX:MaxMetaspaceSize=384M -XX:+UseSerialGC -Dfile.encoding=UTF-8/' android/gradle.properties
            printf '%s\n' \
              'org.gradle.daemon=false' \
              'org.gradle.parallel=false' \
              'org.gradle.workers.max=2' \
              'org.gradle.vfs.watch=false' \
              'kotlin.compiler.execution.strategy=in-process' \
              'kotlin.daemon.jvmargs=-Xmx384m' >> android/gradle.properties
            echo "Android SDK/NDK/CMake ready; Gradle configured for CircleCI Medium RAM"

      - run:
          name: Configure Play Store signing
          command: |
            set -euo pipefail
            : "${ANDROID_KEYSTORE_BASE64:?Add ANDROID_KEYSTORE_BASE64 in CircleCI Project Settings > Environment Variables}"
            : "${ANDROID_KEYSTORE_PASSWORD:?Add ANDROID_KEYSTORE_PASSWORD in CircleCI}"
            : "${ANDROID_KEY_ALIAS:?Add ANDROID_KEY_ALIAS in CircleCI}"
            : "${ANDROID_KEY_PASSWORD:?Add ANDROID_KEY_PASSWORD in CircleCI}"

            KEYSTORE_FILE="$HOME/flavorflow-upload-key"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$KEYSTORE_FILE"
            chmod 600 "$KEYSTORE_FILE"

            # Detect JKS versus PKCS12 without exposing any key information.
            if keytool -list -keystore "$KEYSTORE_FILE" -storepass "$ANDROID_KEYSTORE_PASSWORD" -storetype JKS >/dev/null 2>&1; then
              STORE_TYPE=jks
            elif keytool -list -keystore "$KEYSTORE_FILE" -storepass "$ANDROID_KEYSTORE_PASSWORD" -storetype PKCS12 >/dev/null 2>&1; then
              STORE_TYPE=pkcs12
            else
              echo "Keystore/password invalid or unsupported" >&2
              exit 1
            fi

            printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\nstoreType=%s\n' \
              "$KEYSTORE_FILE" \
              "$ANDROID_KEYSTORE_PASSWORD" \
              "$ANDROID_KEY_ALIAS" \
              "$ANDROID_KEY_PASSWORD" \
              "$STORE_TYPE" > android/key.properties
            echo "Signing identity validated ($STORE_TYPE)"

      # APK first: staff can install/test it even if the later AAB step fails.
      - run:
          name: Build signed release APK
          no_output_timeout: 30m
          command: flutter build apk --release --dart-define=API_BASE="$ERP_SERVER_API"

      - run:
          name: Collect signed APK
          command: |
            set -euo pipefail
            APK=build/app/outputs/flutter-apk/app-release.apk
            test -s "$APK"
            mkdir -p circleci-artifacts
            cp "$APK" circleci-artifacts/FlavorFlow-release.apk
            ls -lh circleci-artifacts/FlavorFlow-release.apk

      # Upload immediately. CircleCI still preserves this APK if AAB later fails.
      - store_artifacts:
          path: circleci-artifacts/FlavorFlow-release.apk
          destination: FlavorFlow-Android/FlavorFlow-release.apk

      - run:
          name: Build signed Play Store AAB
          no_output_timeout: 30m
          command: flutter build appbundle --release --dart-define=API_BASE="$ERP_SERVER_API"

      - run:
          name: Verify and collect AAB
          command: |
            set -euo pipefail
            AAB=build/app/outputs/bundle/release/app-release.aab
            test -s "$AAB"
            jarsigner -verify "$AAB" >/dev/null
            cp "$AAB" circleci-artifacts/FlavorFlow-release.aab
            if [ -f build/app/outputs/mapping/release/mapping.txt ]; then
              cp build/app/outputs/mapping/release/mapping.txt circleci-artifacts/mapping.txt
            fi
            ls -lh circleci-artifacts

      - store_artifacts:
          path: circleci-artifacts
          destination: FlavorFlow-Android

      - run:
          name: Remove signing files
          when: always
          command: |
            rm -f android/key.properties "$HOME/flavorflow-upload-key"


  build-web:
    docker:
      - image: ghcr.io/cirruslabs/flutter:stable
    resource_class: medium
    steps:
      - checkout
      - restore_cache:
          keys:
            - flavorflow-v2-{{ checksum "pubspec.lock" }}
            - flavorflow-v2-
      - run:
          name: Get Flutter packages
          command: flutter pub get
      - run:
          name: Build web release
          no_output_timeout: 30m
          command: flutter build web --release --no-tree-shake-icons
      - run:
          name: Zip website
          command: |
            set -euo pipefail
            cd build/web && zip -qr ../../flavorflow-web.zip . && cd ../..
            ls -lh flavorflow-web.zip
      - store_artifacts:
          path: flavorflow-web.zip
          destination: flavorflow-web.zip

workflows:
  play-store-release:
    jobs:
      - approve-release:
          type: approval
          filters:
            branches:
              only:
                - arena/01a003d0-flavorflow
                - arena/01a01af5-flavorflow
      - build-play-store-release:
          requires:
            - approve-release
          filters:
            branches:
              only:
                - arena/01a003d0-flavorflow
                - arena/01a01af5-flavorflow
      - approve-web:
          type: approval
          filters:
            branches:
              only:
                - arena/01a003d0-flavorflow
                - arena/01a01af5-flavorflow
      - build-web:
          requires:
            - approve-web
          filters:
            branches:
              only:
                - arena/01a003d0-flavorflow
                - arena/01a01af5-flavorflow
