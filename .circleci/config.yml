# FlavorFlow ERP — CircleCI Android build (memory-safe for 4GB executors).
# The Gradle daemon was OOM-killed ("daemon disappeared unexpectedly");
# gradle.properties caps workers/kotlin-daemon and this config caps Gradle.
version: 2.1

jobs:
  build-apk:
    docker:
      - image: cimg/android:2024.01.1
    resource_class: large
    environment:
      ERP_SERVER_API: "https://flavorflow.duckdns.org/api"
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"
    steps:
      - checkout
      - run:
          name: Install Flutter (stable)
          command: |
            git clone --depth 1 -b stable https://github.com/flutter/flutter.git $HOME/flutter
            echo 'export PATH=$HOME/flutter/bin:$PATH' >> $BASH_ENV
            source $BASH_ENV
            flutter --version
      - run:
          name: Install native build tools (ninja + cmake — CXX1416 fix)
          command: |
            sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build cmake
            (yes | sdkmanager "cmake;3.22.1") || true
            ninja --version && cmake --version
      - run:
          name: Pub get
          command: flutter pub get
      - run:
          name: Launcher icons
          command: dart run flutter_launcher_icons || echo skipped
      - restore_cache:
          keys:
            - deps-v1-{{ checksum "pubspec.lock" }}
            - deps-v1-
      - run:
          name: Build release APK
          no_output_timeout: 75m
          command: |
            # heartbeat: Gradle native compile is silent for long stretches —
            # without this CircleCI kills the step ("Too long with no output")
            while true; do sleep 55; echo "... build chal rahi $(date +%H:%M:%S)"; done &
            flutter build apk --release --dart-define=API_BASE="$ERP_SERVER_API"
      - save_cache:
          key: deps-v1-{{ checksum "pubspec.lock" }}
          paths:
            - ~/.pub-cache
            - ~/.gradle/caches
            - ~/.gradle/wrapper
      - store_artifacts:
          path: build/app/outputs/flutter-apk/app-release.apk
          destination: app-release.apk

  build-web:
    docker:
      - image: cimg/base:current
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Install Flutter (stable)
          command: |
            git clone --depth 1 -b stable https://github.com/flutter/flutter.git $HOME/flutter
            echo 'export PATH=$HOME/flutter/bin:$PATH' >> $BASH_ENV
            source $BASH_ENV
            flutter --version
            flutter config --enable-web
      - run:
          name: Pub get
          command: flutter pub get
      - run:
          name: Build web release
          no_output_timeout: 30m
          command: flutter build web --release --no-tree-shake-icons
      - run:
          name: Zip website
          command: cd build/web && zip -r ../../flavorflow-web.zip . && cd ../.. && ls -la flavorflow-web.zip
      - store_artifacts:
          path: flavorflow-web.zip
          destination: flavorflow-web.zip

workflows:
  android:
    jobs:
      - build-apk
      - build-web
