version: 2.1

# FlavorFlow Android/web builds on CircleCI.
# Release and web jobs start automatically for the listed Arena branches.

executors:
  flutter_android:
    docker:
      - image: ghcr.io/cirruslabs/flutter:stable
    resource_class: large
    environment:
      ERP_SERVER_API: "https://flavorflow.duckdns.org/api"
      # CircleCI Medium has limited RAM. Keep Gradle/Kotlin in one small JVM;
      # Flutter/Dart and Android tooling need the remaining memory.
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Dorg.gradle.parallel=false -Dkotlin.compiler.execution.strategy=in-process"

jobs:
  build-play-store-release:
    executor: flutter_android
    steps:
      - checkout

      - run:
          name: Verify Flutter and Java
          command: |
            flutter --version
            java -version

      - restore_cache:
          keys:
            - flavorflow-v2-{{ checksum "pubspec.lock" }}
            - flavorflow-v2-

      - run:
          name: Get Flutter packages
          command: flutter pub get

      - save_cache:
          key: flavorflow-v2-{{ checksum "pubspec.lock" }}
          paths:
            - ~/.pub-cache
            - ~/.gradle/caches
            - ~/.gradle/wrapper

      - run:
          name: Generate launcher icons (Android)
          command: |
            # This repository is Android/web only. The package generates the
            # Android icons first, then exits when it cannot find ios/Runner.
            # Keep the generated/committed Android icons and continue.
            dart run flutter_launcher_icons || echo "iOS icon target absent — Android icons retained"

      - run:
          name: Prepare complete Android toolchain and low-memory Gradle
          no_output_timeout: 25m
          command: |
            set -euo pipefail
            NDK_VERSION="28.2.13676358"
            CMAKE_VERSION="3.22.1"
            SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/opt/android-sdk-linux}}"
            SDKMANAGER=$(find "$SDK_ROOT" -type f -name sdkmanager -print -quit)
            test -n "$SDKMANAGER"
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true

            # Install packages one at a time. A transient/corrupt SDK archive
            # ("ZipFile unknown archive") must not poison the next package in
            # the same sdkmanager invocation. Remove the incomplete package and
            # SDK download cache, then retry the individual archive.
            package_ready() {
              local package="$1"
              local dir="${package//;//}"
              case "$package" in
                platforms\;*) test -f "$SDK_ROOT/$dir/android.jar" ;;
                build-tools\;*) test -x "$SDK_ROOT/$dir/aapt2" ;;
                cmake\;*) test -x "$SDK_ROOT/$dir/bin/cmake" ;;
                ndk\;*) test -f "$SDK_ROOT/$dir/source.properties" ;;
                *) test -f "$SDK_ROOT/$dir/package.xml" ;;
              esac
            }

            install_sdk_package() {
              local package="$1"
              local dir="${package//;//}"
              local attempt
              if package_ready "$package"; then
                echo "SDK package already ready: $package"
                return 0
              fi
              for attempt in 1 2 3; do
                echo "Installing $package (attempt $attempt/3)"
                if [ "$attempt" -gt 1 ]; then
                  rm -rf "$SDK_ROOT/$dir" "$SDK_ROOT/.temp" "$SDK_ROOT/temp" "$HOME/.android/cache"
                fi
                # sdkmanager sometimes returns non-zero after extracting the
                # usable SDK files because an optional template archive is bad.
                # Validate the actual file Gradle needs before discarding it.
                yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" "$package" || true
                if package_ready "$package"; then
                  echo "SDK package usable after sdkmanager warning: $package"
                  return 0
                fi
                # sdkmanager can leave an apparently partial directory after a
                # failed unzip; force the next attempt to download a clean zip.
                rm -rf "$SDK_ROOT/$dir"
              done
              echo "FATAL: unable to install a valid SDK package: $package" >&2
              return 1
            }

            # Prefer a complete platform already bundled in the Flutter image.
            # The runner's Google archive for android-35 is currently returning
            # corrupt zips, so downloading a platform is only the last resort.
            PLATFORM_JAR=$(find "$SDK_ROOT/platforms" -mindepth 2 -maxdepth 2 -type f -name android.jar -print 2>/dev/null | sort -V | tail -1 || true)
            if [ -n "$PLATFORM_JAR" ]; then
              PLATFORM_API=$(basename "$(dirname "$PLATFORM_JAR")" | sed 's/^android-//')
              if [ "$PLATFORM_API" -ge 35 ]; then
                echo "Using bundled Android Platform $PLATFORM_API"
                printf 'flavorflow.compileSdk=%s\n' "$PLATFORM_API" >> android/gradle.properties
              else
                PLATFORM_JAR=''
              fi
            fi
            if [ -z "$PLATFORM_JAR" ]; then
              install_sdk_package "platforms;android-35"
              package_ready "platforms;android-35"
              printf '%s\n' 'flavorflow.compileSdk=35' >> android/gradle.properties
            fi

            BUILD_TOOLS_DIR=$(find "$SDK_ROOT/build-tools" -mindepth 2 -maxdepth 2 -type f -name aapt2 -print 2>/dev/null | sort -V | tail -1 || true)
            if [ -z "$BUILD_TOOLS_DIR" ]; then
              install_sdk_package "build-tools;35.0.0"
              package_ready "build-tools;35.0.0"
            else
              echo "Using bundled Android build tools: $(basename "$(dirname "$BUILD_TOOLS_DIR")")"
            fi

            CMAKE_BIN=$(find "$SDK_ROOT/cmake" -mindepth 2 -maxdepth 3 -type f -path '*/bin/cmake' -print 2>/dev/null | sort -V | tail -1 || true)
            if [ -z "$CMAKE_BIN" ]; then
              install_sdk_package "cmake;$CMAKE_VERSION"
              package_ready "cmake;$CMAKE_VERSION"
            fi

            NDK_DIR=$(find "$SDK_ROOT/ndk" -mindepth 1 -maxdepth 1 -type d -print 2>/dev/null | sort -V | tail -1 || true)
            if [ -n "$NDK_DIR" ] && [ -f "$NDK_DIR/source.properties" ]; then
              NDK_INSTALLED=$(basename "$NDK_DIR")
              echo "Using bundled Android NDK $NDK_INSTALLED"
              printf 'flavorflow.ndkVersion=%s\n' "$NDK_INSTALLED" >> android/gradle.properties
            else
              install_sdk_package "ndk;$NDK_VERSION"
              package_ready "ndk;$NDK_VERSION"
              printf '%s\n' "flavorflow.ndkVersion=$NDK_VERSION" >> android/gradle.properties
            fi

            sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx2048M -XX:MaxMetaspaceSize=512M -Dfile.encoding=UTF-8/' android/gradle.properties
            printf '%s\n' \
              'org.gradle.daemon=false' \
              'org.gradle.parallel=false' \
              'org.gradle.workers.max=2' \
              'org.gradle.vfs.watch=false' \
              'kotlin.compiler.execution.strategy=in-process' \
              'kotlin.daemon.jvmargs=-Xmx768m' >> android/gradle.properties
            echo "Android SDK/NDK/CMake ready; Gradle configured for CircleCI Medium RAM"

      - run:
          name: Configure Play Store signing
          command: |
            set -euo pipefail
            : "${ANDROID_KEYSTORE_BASE64:?Add ANDROID_KEYSTORE_BASE64 in CircleCI Project Settings > Environment Variables}"
            : "${ANDROID_KEYSTORE_PASSWORD:?Add ANDROID_KEYSTORE_PASSWORD in CircleCI}"
            : "${ANDROID_KEY_ALIAS:?Add ANDROID_KEY_ALIAS in CircleCI}"
            : "${ANDROID_KEY_PASSWORD:?Add ANDROID_KEY_PASSWORD in CircleCI}"

            KEYSTORE_FILE="$HOME/flavorflow-upload-key"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$KEYSTORE_FILE"
            chmod 600 "$KEYSTORE_FILE"

            # Detect JKS versus PKCS12 without exposing any key information.
            if keytool -list -keystore "$KEYSTORE_FILE" -storepass "$ANDROID_KEYSTORE_PASSWORD" -storetype JKS >/dev/null 2>&1; then
              STORE_TYPE=jks
            elif keytool -list -keystore "$KEYSTORE_FILE" -storepass "$ANDROID_KEYSTORE_PASSWORD" -storetype PKCS12 >/dev/null 2>&1; then
              STORE_TYPE=pkcs12
            else
              echo "Keystore/password invalid or unsupported" >&2
              exit 1
            fi

            printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\nstoreType=%s\n' \
              "$KEYSTORE_FILE" \
              "$ANDROID_KEYSTORE_PASSWORD" \
              "$ANDROID_KEY_ALIAS" \
              "$ANDROID_KEY_PASSWORD" \
              "$STORE_TYPE" > android/key.properties
            echo "Signing identity validated ($STORE_TYPE)"

      # APK first: staff can install/test it even if the later AAB step fails.
      - run:
          name: Build signed release APK
          no_output_timeout: 30m
          command: flutter build apk --release --dart-define=API_BASE="$ERP_SERVER_API"

      - run:
          name: Collect signed APK
          command: |
            set -euo pipefail
            APK=build/app/outputs/flutter-apk/app-release.apk
            test -s "$APK"
            mkdir -p circleci-artifacts
            cp "$APK" circleci-artifacts/FlavorFlow-release.apk
            ls -lh circleci-artifacts/FlavorFlow-release.apk

      # Upload immediately. CircleCI still preserves this APK if AAB later fails.
      - store_artifacts:
          path: circleci-artifacts/FlavorFlow-release.apk
          destination: FlavorFlow-Android/FlavorFlow-release.apk

      - run:
          name: Build signed Play Store AAB
          no_output_timeout: 30m
          command: flutter build appbundle --release --dart-define=API_BASE="$ERP_SERVER_API"

      - run:
          name: Verify and collect AAB
          command: |
            set -euo pipefail
            AAB=build/app/outputs/bundle/release/app-release.aab
            test -s "$AAB"
            jarsigner -verify "$AAB" >/dev/null
            cp "$AAB" circleci-artifacts/FlavorFlow-release.aab
            if [ -f build/app/outputs/mapping/release/mapping.txt ]; then
              cp build/app/outputs/mapping/release/mapping.txt circleci-artifacts/mapping.txt
            fi
            ls -lh circleci-artifacts

      - store_artifacts:
          path: circleci-artifacts
          destination: FlavorFlow-Android

      - run:
          name: Remove signing files
          when: always
          command: |
            rm -f android/key.properties "$HOME/flavorflow-upload-key"


  build-web:
    docker:
      - image: ghcr.io/cirruslabs/flutter:stable
    resource_class: medium
    steps:
      - checkout
      - restore_cache:
          keys:
            - flavorflow-v2-{{ checksum "pubspec.lock" }}
            - flavorflow-v2-
      - run:
          name: Get Flutter packages
          command: flutter pub get
      - run:
          name: Build web release
          no_output_timeout: 30m
          command: flutter build web --release --no-tree-shake-icons
      - run:
          name: Zip website
          command: |
            set -euo pipefail
            cd build/web && zip -qr ../../flavorflow-web.zip . && cd ../..
            ls -lh flavorflow-web.zip
      - store_artifacts:
          path: flavorflow-web.zip
          destination: flavorflow-web.zip

workflows:
  play-store-release:
    jobs:
      - build-play-store-release:
          filters:
            branches:
              only:
                - arena/01a003d0-flavorflow
                - arena/01a01af5-flavorflow
                - arena/01a0858b-flavorflow
                - arena/01a0dc70-flavorflow
      - build-web:
          filters:
            branches:
              only:
                - arena/01a003d0-flavorflow
                - arena/01a01af5-flavorflow
                - arena/01a0858b-flavorflow
                - arena/01a0dc70-flavorflow
