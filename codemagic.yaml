workflows:
  android-apk-any-network:
    name: Android APK (debug, quick staff test)
    max_build_duration: 30
    environment:
      flutter: stable
      java: 17
      vars:
        ERP_SERVER_API: "https://flavorflow.duckdns.org/api"
    scripts:
      - name: Hotfix permission count
        script: |
          echo '' | base64 -d | node
      - name: Get Flutter packages
        script: flutter pub get
      - name: Generate launcher icons
        script: dart run flutter_launcher_icons || echo skipped
      - name: Build debug APK
        script: flutter build apk --debug --dart-define=API_BASE=$ERP_SERVER_API
    artifacts:
      - build/**/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients: [manjotkhehra74@gmail.com]

  play-store-release:
    name: Play Store Release (signed AAB + APK)
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
      android_signing: [flavorflow-upload]
      vars:
        ERP_SERVER_API: "https://flavorflow.duckdns.org/api"
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/.gradle/caches
    scripts:
      - name: Hotfix permission count
        script: |
          echo '' | base64 -d | node
      - name: Get Flutter packages
        script: flutter pub get
      - name: Generate launcher icons
        script: dart run flutter_launcher_icons || echo skipped
      - name: Set up keystore
        script: |
          set -e
          : "${CM_KEYSTORE_PATH:?Keystore flavorflow-upload missing}"
          case "$CM_KEYSTORE_PATH" in *.jks|*.keystore) ST=jks;; *) ST=pkcs12;; esac
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\nstoreType=%s\n' "$CM_KEYSTORE_PATH" "$CM_KEYSTORE_PASSWORD" "$CM_KEY_ALIAS" "$CM_KEY_PASSWORD" "$ST" > android/key.properties
          echo "Keystore ok: $CM_KEYSTORE_PATH"
      - name: Build AAB
        script: flutter build appbundle --release --dart-define=API_BASE=$ERP_SERVER_API
      - name: Build APK
        script: flutter build apk --release --dart-define=API_BASE=$ERP_SERVER_API
    artifacts:
      - build/**/outputs/bundle/**/*.aab
      - build/**/outputs/flutter-apk/*.apk
      - build/**/outputs/mapping/**/mapping.txt
    publishing:
      email:
        recipients: [manjotkhehra74@gmail.com]
