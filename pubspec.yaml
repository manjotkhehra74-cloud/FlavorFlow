name: flavorflow_erp
description: FlavorFlow ERP — role-based production, store, packing & dispatch with strict RBAC. Native mobile + web.
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5
  go_router: ^14.8.1
  http: ^1.3.0
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  fl_chart: 0.69.2
  pdf: ^3.11.3
  printing: ^5.14.2
  universal_html: ^2.2.4
  path_provider: ^2.1.5
  open_filex: ^4.7.0
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2
  qr_flutter: ^4.1.0
  flutter_local_notifications: ^18.0.1
  mobile_scanner: ^6.0.2
  geolocator: ^13.0.2
  image_picker: ^1.1.2
  timezone: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#1565C0"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter-regular.ttf
          weight: 400
        - asset: assets/fonts/inter-medium.ttf
          weight: 500
        - asset: assets/fonts/inter-semibold.ttf
          weight: 600
        - asset: assets/fonts/inter-bold.ttf
          weight: 700
        - asset: assets/fonts/inter-extrabold.ttf
          weight: 800
